name: Release

# Push a tag like v0.2.0 to build kpiddle for x86_64 and aarch64 and publish
# a GitHub release with:
#   - static kpiddle tarballs, for any distribution;
#   - kpiddle and kpiddle-gui packages (.deb, .rpm, Arch).
# The version is in crates/kpiddle-tui/Cargo.toml (every crate carries the
# same one) and the notes in CHANGELOG.md. Run it manually to build
# everything as workflow artifacts without publishing anything.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Every action is pinned to a full commit SHA (version in the comment) so a
# moved tag can't change what builds the release; Dependabot proposes updates.
permissions:
  contents: read

jobs:
  build:
    name: Binaries, tarball, .deb and .rpm (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check tag matches kpiddle's version and has release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' crates/kpiddle-tui/Cargo.toml | head -1)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match crates/kpiddle-tui version $version"
            exit 1
          fi
          scripts/release-notes.sh "$version" > /dev/null || {
            echo "::error::CHANGELOG.md needs a dated section for $version"
            exit 1
          }

      # ring (TLS for kube-rs) compiles C, which needs musl-gcc for the
      # static build. GTK is for kpiddle-gui only; Ubuntu 24.04 ships 4.14,
      # the minimum it supports.
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools libgtk-4-dev dpkg-dev fakeroot rpm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
          targets: ${{ matrix.arch }}-unknown-linux-musl

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-${{ matrix.arch }}

      - name: Test
        run: cargo test --locked --workspace

      # Builds the static kpiddle and kpiddle-gui, then packages them.
      - name: Build .deb
        run: packaging/build-deb.sh

      - name: Build .rpm
        run: KPIDDLE_SKIP_BUILD=1 packaging/build-rpm.sh

      - name: Tarball
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' crates/kpiddle-tui/Cargo.toml | head -1)
          bin=target/${{ matrix.arch }}-unknown-linux-musl/release/kpiddle
          if ldd "$bin" 2>/dev/null | grep -q '=>'; then
            echo "::error::kpiddle is not statically linked"; ldd "$bin"; exit 1
          fi
          name=kpiddle-$version-${{ matrix.arch }}-linux
          mkdir -p "dist/$name"
          install -m755 "$bin" "dist/$name/kpiddle"
          install -m644 LICENSE "dist/$name/LICENSE"
          install -m644 CHANGELOG.md "dist/$name/CHANGELOG.md"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kpiddle-dist-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            target/debian/*.deb
            target/rpm/*.rpm
          if-no-files-found: error

      # For the Arch job, which packages these same binaries.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kpiddle-binaries-${{ matrix.arch }}
          path: |
            target/release/kpiddle-gui
            target/${{ matrix.arch }}-unknown-linux-musl/release/kpiddle
          if-no-files-found: error

  arch:
    name: Arch packages (${{ matrix.arch }})
    needs: build
    strategy:
      matrix:
        arch: [x86_64, aarch64]
    runs-on: ubuntu-24.04
    # Ubuntu has no makepkg, so package the binaries inside Arch Linux.
    # Packaging only copies files, so the aarch64 package is made here too.
    container: archlinux:latest
    steps:
      - name: Install makepkg
        run: pacman -Syu --noconfirm --needed base-devel

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kpiddle-binaries-${{ matrix.arch }}
          path: target

      - name: Build Arch packages
        # makepkg refuses to run as root.
        run: |
          chmod +x target/release/kpiddle-gui target/${{ matrix.arch }}-unknown-linux-musl/release/kpiddle
          useradd -m builder
          chown -R builder .
          su builder -c 'KPIDDLE_SKIP_BUILD=1 KPIDDLE_ARCH=${{ matrix.arch }} packaging/build-arch.sh'

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kpiddle-arch-${{ matrix.arch }}
          path: target/arch/*.pkg.tar.zst
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, arch]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: kpiddle-dist-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: kpiddle-arch-*
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -laR dist
          version=${GITHUB_REF_NAME#v}
          scripts/release-notes.sh "$version" > notes.md
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "kpiddle $version" \
            --notes-file notes.md \
            dist/dist/*.tar.gz dist/dist/*.sha256 \
            dist/target/debian/*.deb dist/target/rpm/*.rpm dist/*.pkg.tar.zst
