[workspace]
resolver = "3"
members = [
    "crates/kpiddle-core",
    "crates/kpiddle-tui",
    "crates/kpiddle-gui",
]

# Each crate carries kpiddle's version itself (crates/kpiddle-tui is the
# one the release tag must match).
[workspace.package]
edition = "2024"
license = "MIT"
authors = ["Scott Hiemstra <scott@hiemstra.us>"]

# Shared crates from piddle-common, pinned to a release tag's commit (the
# same commit for each). scripts/bump-common.sh vX.Y.Z updates them, and
# scripts/use-local-common.sh builds against a sibling checkout instead.
[workspace.dependencies]
piddle-encode = { git = "https://github.com/scott-hiemstra/piddle-common", rev = "5a28d97804c2dbcd2dd7b25a2e74ed0bc2ca5ac9" } # v0.1.1
piddle-scene = { git = "https://github.com/scott-hiemstra/piddle-common", rev = "5a28d97804c2dbcd2dd7b25a2e74ed0bc2ca5ac9" } # v0.1.1
piddle-gtk = { git = "https://github.com/scott-hiemstra/piddle-common", rev = "5a28d97804c2dbcd2dd7b25a2e74ed0bc2ca5ac9" } # v0.1.1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
