[package]
name = "kpiddle-gui"
description = "kpiddle: Kubernetes pods as bubbles (GTK4 graphical front end)"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "kpiddle-gui"
path = "src/main.rs"

[dependencies]
kpiddle-core = { path = "../kpiddle-core" }
piddle-encode.workspace = true
piddle-scene.workspace = true
piddle-gtk.workspace = true
gtk = { version = "0.11", package = "gtk4", features = ["v4_14"] }
pangocairo = "0.22"
