[package]
name = "kpiddle-core"
description = "kpiddle: Kubernetes pods and their metrics as a UI-independent snapshot"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
futures = "0.3"
k8s-openapi = { version = "0.29", features = ["v1_33"] }
kube = { version = "5", features = ["runtime"] }
piddle-view = { path = "../piddle-view" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "time", "sync", "macros"] }
