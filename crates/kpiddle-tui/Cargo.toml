[package]
name = "kpiddle-tui"
description = "kpiddle: Kubernetes pods by CPU and memory (terminal front end)"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false

# Until the Ratatui interface lands this prints a refreshing text listing.
# The binary takes the `kpiddle` name for now; a GUI/TUI launcher will
# take it over once there is a GUI.
[[bin]]
name = "kpiddle"
path = "src/main.rs"

[dependencies]
kpiddle-core = { path = "../kpiddle-core" }
